 {% extends 'index.html' %}
 {% block title%}
 Home
 {% endblock title%}
 {% block content%}
<div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/static/images/1.jpeg" class="d-block w-100" alt="slide1">
      </div>
    <div class="carousel-item">
      <img src="/static/images/2.jpeg" class="d-block w-100" alt="slide2">
    </div>
    <div class="carousel-item">
      <img src="/static/images/3.jpeg" class="d-block w-100" alt="slide2">
    </div>
  </div>
  <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="sr-only">Previous</span>
  </a>
  <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="sr-only">Next</span>
  </a>
</div>
<a href="{% url 'index'%}">back</a>
<div>
  <table class="table">
  <thead class="thead-dark">
    <tr>
      <th scope="col">Name</th>
      <th scope="col">Father</th>
      <th scope="col">joindate</th>
      <th scope="col">stu_class</th>
      <th scope="col">fees</th>
    </tr>
  </thead>
  <tbody>
  {% for rec in data %}
  
    <tr>
      <th scope="row">{{rec.stu_name}}</th>
      <td>{{rec.stu_father}}</td>
      <td>{{rec.joindate}}</td>
      <td>{{rec.stu_class}}</td>
      <td>{{rec.fees}}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
{% endblock content%}
